name: public-excerpt-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public excerpt
        run: python -m pip install -e ".[dev]"
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit curated file set and common secret formats
        run: python tools/audit_release.py
