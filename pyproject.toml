[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marginscout-public"
version = "0.1.0"
description = "Public engineering excerpt for a personal, single-user opportunity organization project"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "David Plam" }]
dependencies = [
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
